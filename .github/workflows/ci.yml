name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install Dependencies and Build Client
      working-directory: ./client
      run: |
        npm install
        npm run build

    - name: Install Dependencies for Server
      working-directory: ./server
      run: |
        npm install

    # If you add tests in the future, uncomment below:
    # - name: Run tests
    #   working-directory: ./server
    #   run: npm test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Server Image
      run: docker build -t calorie-tracker-server ./server
      
    - name: Build Client Image
      run: docker build -t calorie-tracker-client ./client
